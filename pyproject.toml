[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dataforge"
version = "0.1.0"
description = "A reusable, contract-driven data product pipeline pattern (bronze/silver/gold)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Data Platform Engineering" }]

# Keep runtime deps minimal; heavier engine deps are optional extras.
dependencies = [
  "pydantic>=2.7",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
duckdb = ["duckdb>=1.0", "pyarrow>=16.0"]
# Only needed for secret:// / ssm:// references and S3 storage.
aws = ["boto3>=1.34", "pyarrow>=16.0"]
iceberg = ["pyiceberg[s3fs,glue]>=0.7", "pyarrow>=16.0"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML",
  "boto3>=1.34",
  "moto[server]>=5.0",
]

[project.scripts]
dataforge = "dataforge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dataforge"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "contract: tests that validate declared data contracts",
  "cloud: tests that need a live S3-compatible endpoint (a moto server is started for them)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "ARG", "PTH", "RUF"]
ignore = ["E501"]

[[tool.mypy.overrides]]
# These libraries ship without type stubs.
module = ["pyarrow.*", "boto3.*", "botocore.*", "pyiceberg.*"]
ignore_missing_imports = true

[tool.mypy]
python_version = "3.11"
packages = ["dataforge"]
mypy_path = "src"
strict = true
warn_unreachable = true
disallow_untyped_decorators = false
